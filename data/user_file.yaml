# 用例1：新增带图片上传用户（files 走 form-data 表单）
- id: user_file_1
  feature: 用户管理
  story: 新增带图片成功
  title: 新增带图片上传用户，添加成功
  method: post
  path: /api/user/addSaveImg
  headers:
    Authorization: "${TOKEN}"
  params:
  data:
    username: "auto_test_测试数据3"
    password: "123456"
  json:
  files:
    img_file: ./file/test.jpg
  check:
    code: "$..code"
    msg: "$..msg"
  expected:
    code: 1
    msg: "操作成功"
  sql_check:
  sql_expected:
  jsonExData:
    user_id: "$..data"
  sqlExData:
  is_true: false

