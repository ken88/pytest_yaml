[pytest]
# 指定测试用例的目录
testpaths = ./testcases

# 默认执行参数（你以后敲 pytest，它自动带上这些）
addopts =
    -vs
    --alluredir=./report/json_report
    --clean-alluredir

# 生成的log日志
log_file =./log/test.log
log_file_level = info
log_file_format = %(asctime)s %(filename)-16s [函数:%(funcName)-18s] [行号:%(lineno)-4d] %(levelname)s -- %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 控制台输出
log_cli = True
log_cli_level = info
log_cli_format = %(asctime)s %(filename)-16s [函数:%(funcName)-18s] [行号:%(lineno)-4d] %(levelname)s -- %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

